<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MicroG Sentinel · Body map options</title>
<style>
:root{color-scheme:dark;--background:#111315;--foreground:#f2efe7;--muted:#b2b9bc;--card:#191d20;--border:#3b4247;--primary:#ff5a1f;--ring:#f2efe7;--radius:22px;--font-sans:'IBM Plex Sans',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;color:var(--foreground);font-family:var(--font-sans)}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid var(--ring);outline-offset:5px;z-index:8}button:hover{border-color:#dee6e5}button[aria-selected=true]{font-weight:700}button:active{translate:0 1px}[hidden]{display:none!important}
.app{background:var(--background);max-width:1248px;margin:auto;padding:24px;border-radius:var(--radius);min-width:0}.mast{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:13px;letter-spacing:.06em;font-weight:650}.brand span{display:inline-block;margin-right:9px;border:1px solid #9bb9bc;border-radius:50%;width:22px;height:22px;text-align:center;line-height:20px}.stamp{font-size:11px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase}.switcher{display:flex;gap:6px;margin:26px 0 30px;background:#202528;padding:5px;border-radius:16px;width:max-content;max-width:100%}.switcher button{min-height:44px;padding:9px 22px;border:1px solid transparent;background:transparent;border-radius:12px;color:var(--muted)}.switcher button[aria-selected=true]{background:var(--foreground);color:#111315}.switcher span{margin-left:9px;font-size:12px}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}h1{font-size:clamp(29px,4vw,44px);letter-spacing:-.045em;line-height:1.1;margin:7px 0 12px;font-weight:550}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.caption{color:var(--muted);font-size:14px;line-height:1.5;margin:0;max-width:620px}.simulated{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid #5b666b;border-radius:7px;padding:5px 8px;font-size:11px;color:#d5dcdc}.simulated:before{content:'◇';font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(270px,1fr);gap:26px;margin-top:22px;align-items:center}.map-shell{min-width:0;background:#171b1e;border:1px solid #333c41;border-radius:28px;overflow:hidden;position:relative}.map-top{display:flex;justify-content:space-between;padding:19px 22px 0;font-size:11px;color:var(--muted);letter-spacing:.07em}.stage{position:relative;width:100%;aspect-ratio:520/540;isolation:isolate}.art{width:100%;height:100%;display:block;overflow:visible}.map-foot{margin:0;padding:0 18px 20px;text-align:center;font-size:12px;color:var(--muted)}.region{position:absolute;width:29%;min-height:57px;border:1px solid #58656c;border-radius:13px;padding:9px 10px;background:#20272bf2;text-align:left;box-shadow:0 4px 16px #0002;transition:background .18s,border-color .18s,transform .18s}.region .name{display:block;font-size:13px;line-height:1.3;font-weight:600}.region .status{display:block;font-size:10px;color:#bfc9cc;line-height:1.5;margin-top:4px;white-space:nowrap}.region .status b{font-size:8px;letter-spacing:.06em;font-weight:500;margin-right:3px}.region:hover{transform:translateY(-3px);background:#303b41}.region[aria-pressed=true]{border-color:var(--primary);background:#34251f;box-shadow:0 0 0 1px var(--primary)}.region[aria-pressed=true] .name{color:var(--primary)}.region[aria-pressed=true] .name:before{content:'✓ ';font-size:11px}.region[aria-pressed=true] .status{color:var(--foreground)}.side-left{left:3.5%}.side-right{right:3.5%}.region[data-region=head]{top:12%}.region[data-region=eyes]{top:24%}.region[data-region=heart]{top:40%}.region[data-region=skin]{top:52%}.region[data-region=gut]{top:65%}.region[data-region=bones]{top:79%}
.sheet{align-self:stretch;display:flex;flex-direction:column;justify-content:center;padding:24px 0}.sheet h2{font-size:30px;letter-spacing:-.035em;line-height:1.15;font-weight:500;margin:15px 0}.sheet .reading{display:flex;gap:9px;align-items:center;font-size:13px;color:#d9e0df;margin-bottom:27px}.reading .signal{border:1px solid #526166;padding:5px 9px;border-radius:6px}.risk-label{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}.risk-tabs{display:flex;flex-wrap:wrap;gap:7px}.risk-tabs button{background:transparent;min-height:44px;border:1px solid #536066;border-radius:10px;padding:10px 13px;font-size:13px}.risk-tabs button[aria-selected=true]{border-color:#dee6e5;background:#293237}.risk-content{border-top:1px solid #3b4247;padding-top:20px;margin-top:20px;min-height:120px}.risk-content h3{font-weight:500;font-size:17px;margin:0 0 10px}.risk-content p{font-size:13px;line-height:1.6;color:var(--muted);margin:0;max-width:32ch}.sheet-tail{margin-top:32px;font-size:11px;color:#a4afb2;line-height:1.7}.key{border:1px solid #58646a;border-radius:4px;padding:1px 5px}.footer{margin-top:24px;border-top:1px solid #343b40;padding-top:16px;display:flex;gap:10px;justify-content:space-between;font-size:11px;color:var(--muted)}
.astronaut{animation:float 5s ease-in-out infinite;transform-origin:center}.region-dot{fill:#c4d3d4;stroke:#111315;stroke-width:3;transition:fill .2s}.selected-dot{fill:var(--primary)}.halo{opacity:0;fill:none;stroke:#d1eeec;stroke-width:2}.hotspot.lit .halo,.hotspot.selected .halo{opacity:.8;animation:pulse 1.6s ease-in-out infinite}.hotspot.selected .halo{stroke:var(--primary)}.leader{fill:none;stroke:#6b8088;stroke-width:1;stroke-dasharray:3 5}.orbit{fill:none;stroke:#3b4b53;stroke-width:1}.scanner .map-shell{background:repeating-linear-gradient(0deg,#141c20 0px,#141c20 39px,#203039 40px)}.scan-line{animation:sweep 2.4s ease-in-out both;stroke:#b6e9e1;stroke-width:2}.scan-wash{animation:sweep 2.4s ease-in-out both;fill:url(#scan-gradient)}.scan-body{transform-origin:260px 265px;transition:transform .5s}.scan-body.zoomed{transform:scale(1.045)}.organ{opacity:.12;transition:opacity .35s;stroke:#b7d9d8;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.organ.revealed{opacity:1;stroke:var(--primary)}.scanner .region{background:#172329}.scanner .region[aria-pressed=true]{background:#34251f}.scan-pill{position:absolute;bottom:1%;left:50%;transform:translateX(-50%);font:10px var(--font-sans);letter-spacing:.12em;color:#aec9cb;white-space:nowrap}
.stickers .map-shell{background:#1c2021}.stickers .region{width:36%;border-radius:17px;background:#d9e4d9;color:#17231d;border:2px solid #eff6ec;box-shadow:3px 5px 0 #0b0f12;min-height:75px;transform:rotate(var(--tilt,-3deg));padding:10px 12px}.stickers .region .status{color:#3e5348}.stickers .region:hover{transform:rotate(0deg) scale(1.04)}.stickers .region[aria-pressed=true]{background:var(--primary);border-color:#ffc0a9;transform:rotate(0deg) scale(1.04)}.stickers .region[aria-pressed=true] .name,.stickers .region[aria-pressed=true] .status{color:#1b1b18}.stickers .region[data-region=head]{top:7%;left:21%;--tilt:-7deg;background:#dedcef}.stickers .region[data-region=eyes]{top:23%;right:14%;--tilt:6deg;background:#d6e6ed}.stickers .region[data-region=heart]{top:41%;left:13%;--tilt:-5deg}.stickers .region[data-region=skin]{top:48%;right:9%;--tilt:7deg;background:#e9dfcb}.stickers .region[data-region=gut]{top:62%;left:18%;--tilt:4deg;background:#e0ddeb}.stickers .region[data-region=bones]{top:79%;right:15%;--tilt:-6deg;background:#cddfe0}.stickers .region[aria-pressed=true]{background:var(--primary)}.sticker-icon{display:inline-block;margin-right:6px;font-size:15px}.stickers .region.pop{animation:pop .35s ease-out}.stickers .sheet h2{font-size:32px}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}@keyframes pulse{0%,100%{stroke-width:2;opacity:.5}50%{stroke-width:5;opacity:1}}@keyframes sweep{from{transform:translateY(55px);opacity:0}15%{opacity:1}85%{opacity:1}to{transform:translateY(490px);opacity:0}}@keyframes pop{50%{transform:rotate(0deg) scale(1.12)}}
@media(min-width:1000px){.app{padding:32px 42px}.layout{gap:60px}.sheet{padding-right:24px}.stage{max-height:630px}.region .name{font-size:15px}.region .status{font-size:11px}}
@media(max-width:680px){.app{padding:17px 12px;border-radius:0}.stamp{font-size:9px}.switcher{margin:22px 0}.switcher button{padding:9px 16px}.heading{gap:8px}.heading>.simulated{margin-top:10px}.layout{grid-template-columns:1fr;gap:0;margin-top:18px}.sheet{padding:25px 10px 8px}.sheet h2{font-size:27px;margin:10px 0}.sheet .reading{margin-bottom:20px}.sheet-tail{margin-top:15px}.risk-content{min-height:95px}.footer{line-height:1.5}.map-top{padding:16px 14px 0}.caption{font-size:13px}.map-shell{border-radius:22px}.region{padding:7px;min-height:52px}.region .name{font-size:11px}.region .status{font-size:9px}.region .status b{font-size:7px}.stickers .region{min-height:58px;padding:8px}.sticker-icon{font-size:12px;margin-right:3px}.map-foot{font-size:11px;padding-bottom:16px}}
@media(max-width:360px){.switcher span{display:none}.switcher{width:100%}.switcher button{flex:1}.brand{font-size:11px}.stamp{font-size:8px}.heading>.simulated{font-size:9px;padding:4px}.region .status{font-size:8px}.region .name{font-size:10px}.stickers .region .name{font-size:10px}.sticker-icon{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.scan-line,.scan-wash{display:none}.scan-body.zoomed{transform:none}}
</style>
</head>
<body>
<main class="app">
  <header class="mast"><div class="brand"><span aria-hidden="true">µ</span>MicroG Sentinel</div><div class="stamp">Crew health · Concept</div></header>
  <div class="switcher" role="tablist" aria-label="Body map designs">
    <button id="tab-a" role="tab" aria-selected="true" aria-controls="option-a" data-option="a">A<span>Float buddy</span></button>
    <button id="tab-b" role="tab" aria-selected="false" aria-controls="option-b" data-option="b" tabindex="-1">B<span>Inner space</span></button>
    <button id="tab-c" role="tab" aria-selected="false" aria-controls="option-c" data-option="c" tabindex="-1">C<span>Body stickers</span></button>
  </div>
  <div id="options"></div>
  <footer class="footer"><span>NASA Space Apps 2026 · Design study</span><span>Sample data only</span></footer>
</main>
<script>
'use strict';
const regions=[
 {id:'head',name:'Head',tabs:['Sleep','Balance','Mood'],status:'No data',symbol:'☾',point:[245,91]},
 {id:'eyes',name:'Eyes',tabs:['SANS (vision)'],status:'No data',symbol:'◉',point:[280,149]},
 {id:'heart',name:'Heart & lungs',tabs:['Heart'],status:'+41 bpm',symbol:'♡',point:[237,245]},
 {id:'skin',name:'Skin',tabs:['Immune'],status:'1 new photo',symbol:'✧',point:[329,300]},
 {id:'gut',name:'Gut',tabs:['Food','Microbiome'],status:'No data',symbol:'≋',point:[249,332]},
 {id:'bones',name:'Bones',tabs:['Bone'],status:'No data',symbol:'⋈',point:[286,430]}
];
const options=[
 {id:'a',name:'Float buddy',eyebrow:'A / Your zero-g companion',caption:'A gentle floating astronaut; tap a glowing region to check in.',mapLabel:'Zero-g view',hint:'Tap a region. Meet your body.',className:'friendly'},
 {id:'b',name:'Inner space',eyebrow:'B / A closer look',caption:'Sweep the body, then tap a region to zoom and reveal what’s inside.',mapLabel:'Front scan',hint:'Tap to reveal the anatomy.',className:'scanner'},
 {id:'c',name:'Body stickers',eyebrow:'C / A little more you',caption:'Pick a sticker on the silhouette; it pops forward and opens its risks.',mapLabel:'Your body board',hint:'Six stickers. One whole you.',className:'stickers'}
];
const details={Sleep:'No sleep sample yet.',Balance:'No balance sample yet.',Mood:'No mood check-in yet.','SANS (vision)':'No vision sample yet.',Heart:'Sample change from baseline. This is a simulated live reading.',Immune:'One sample photo is ready for review.',Food:'No food log yet.',Microbiome:'No microbiome sample yet.',Bone:'No bone sample yet.'};
const svgStart='<svg class="art" viewBox="0 0 520 540" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">';
function leaders(){return '<g class="leader">'+regions.map((r,i)=>{const [x,y]=r.point;return `<path d="M${x} ${y} L${i%2?362:158} ${y} L${i%2?353:167} ${[94,158,244,309,379,455][i]}"/>`;}).join('')+'</g>';}
function dots(){return regions.map(r=>`<g class="hotspot" data-hotspot="${r.id}"><circle class="halo" cx="${r.point[0]}" cy="${r.point[1]}" r="18"/><circle class="region-dot" cx="${r.point[0]}" cy="${r.point[1]}" r="7"/></g>`).join('');}
function astronaut(){return svgStart+`
 <ellipse class="orbit" cx="260" cy="293" rx="194" ry="157" transform="rotate(-23 260 293)"/><path class="orbit" d="M86 99v12m-6-6h12M409 390v14m-7-7h14"/>
 <circle cx="397" cy="111" r="3" fill="#839b9f"/><circle cx="102" cy="422" r="2" fill="#839b9f"/>
 <ellipse cx="260" cy="503" rx="73" ry="8" fill="#0d1114"/>
 <g class="astronaut">
 <rect x="193" y="190" width="134" height="166" rx="36" fill="#64797e" stroke="#101719" stroke-width="6"/>
 <path d="M211 220 Q184 204 174 236 L148 319 Q145 336 162 342 Q181 346 187 327 L216 273M309 220 Q336 204 346 236 L372 319 Q375 336 358 342 Q339 346 333 327 L304 273" fill="#bccdce" stroke="#101719" stroke-width="6"/>
 <path d="M210 331 L203 440 Q201 462 222 463 Q241 464 244 443 L260 376 L275 443 Q279 464 299 461 Q318 459 314 440 L308 331" fill="#cfdbd9" stroke="#101719" stroke-width="7"/>
 <path d="M202 434l40 5-4 30q-36 15-45-3zM276 439l39-7 12 32q-10 19-45 5z" fill="#81989d" stroke="#101719" stroke-width="5"/>
 <rect x="198" y="205" width="124" height="148" rx="48" fill="#e2e6dd" stroke="#101719" stroke-width="6"/>
 <path d="M205 309q56 19 110 0" fill="none" stroke="#8a9ea1" stroke-width="12"/>
 <rect x="223" y="237" width="74" height="57" rx="17" fill="#8ca8ae"/><path d="M234 272h13l7-16 10 24 8-14h13" fill="none" stroke="#edf4ee" stroke-width="3"/>
 <circle cx="260" cy="133" r="82" fill="#e4e9e1" stroke="#101719" stroke-width="7"/>
 <rect x="180" y="119" width="13" height="38" rx="6" fill="#9ab0b3"/><rect x="327" y="119" width="13" height="38" rx="6" fill="#9ab0b3"/>
 <rect x="202" y="94" width="116" height="88" rx="40" fill="#273e48" stroke="#a5b9b9" stroke-width="5"/>
 <path d="M218 119q10-13 24-14" fill="none" stroke="#8db9c1" stroke-width="5" stroke-linecap="round"/>
 <path d="M238 142v7m44-7v7" stroke="#edf1e8" stroke-width="7" stroke-linecap="round"/><path d="M249 160q11 9 22 0" fill="none" stroke="#edf1e8" stroke-width="3" stroke-linecap="round"/>
 <path d="M223 198q37 13 74 0" fill="none" stroke="#9caeab" stroke-width="8"/>
 </g>${leaders()}${dots()}</svg>`;}
function scanner(){return svgStart+`
 <defs><linearGradient id="scan-gradient" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#addfd6" stop-opacity="0"/><stop offset="1" stop-color="#addfd6" stop-opacity=".18"/></linearGradient></defs>
 <path d="M178 49h-14v25M342 49h14v25M164 463v25h14M356 463v25h-14" fill="none" stroke="#aac2c6" stroke-width="2"/>
 <g class="scan-body">
 <path d="M260 62c-37 0-48 23-46 55 1 23 12 37 25 45v20l-36 14q-17 6-23 33l-27 103q-3 19 12 22 14 3 20-15l28-72-3 81-7 116q0 19 16 20 17 0 19-18l22-101 22 101q2 18 19 18 16-1 16-20l-7-116-3-81 28 72q6 18 20 15 15-3 12-22l-27-103q-6-27-23-33l-36-14v-20c13-8 24-22 25-45 2-32-9-55-46-55z" fill="#23343d" stroke="#7c9ca8" stroke-width="2"/>
 <path d="M260 183v166M215 350q45 13 90 0" fill="none" stroke="#63808c" stroke-dasharray="3 6"/>
 <g class="organ" data-organ="head"><path d="M258 85q-15-12-24 3-15 4-10 20-8 15 6 22 4 15 26 8M262 85q15-12 24 3 15 4 10 20 8 15-6 22-4 15-26 8M259 87v48M239 92l5 12-9 9m40-21-5 12 9 9"/></g>
 <g class="organ" data-organ="eyes"><path d="M226 149q12-18 24 0-12 17-24 0zm44 0q12-18 24 0-12 17-24 0z"/><circle cx="238" cy="149" r="4"/><circle cx="282" cy="149" r="4"/></g>
 <g class="organ" data-organ="heart"><path d="M248 214q-25-6-28 27t25 22zM272 214q25-6 28 27t-25 22zM249 250q-2-15 11-8 13-7 11 8l-11 14zM260 192v23m0-10-10 9m10-9 10 9"/></g>
 <g class="organ" data-organ="skin"><path d="M322 277l14 9-4 26-13 10-10-22zM320 289l9 6-6 13-8-8z"/><path d="M338 264l5 5m-23-3-1-6m24 45 7 2"/></g>
 <g class="organ" data-organ="gut"><path d="M239 295h34q17 0 17 12t-15 12h-31q-12 0-12 10t12 10h31M239 303v7m8-2h23M259 286q-12 4-8 14"/></g>
 <g class="organ" data-organ="bones"><path d="M281 374l12 63m-20-65q-7-11 0-14 7-3 10 4 7-5 11 0 5 8-5 12M285 437q-8 9-2 14 6 5 11-2 8 5 12-1 4-7-6-12M238 374l-12 63"/></g>
 </g>${leaders()}${dots()}
 <rect class="scan-wash" x="176" y="-60" width="168" height="60"/><path class="scan-line" d="M164 0h192"/>
 </svg><span class="scan-pill">Anatomy illustration</span>`;}
function stickers(){return svgStart+`
 <path d="M84 104l15-6m-9-8 3 23M407 389l16 5m-5-10-7 17" stroke="#728680" stroke-width="2" fill="none"/>
 <circle cx="402" cy="115" r="17" fill="none" stroke="#4c5d56" stroke-dasharray="3 5"/>
 <path d="M261 41q-66 0-66 63 0 42 36 57v16l-56 22-51 109q-9 23 12 32 19 9 31-10l41-65-8 92-22 118q-5 23 18 29 25 5 32-18l32-99 32 99q7 23 32 18 23-6 18-29l-22-118-8-92 41 65q12 19 31 10 21-9 12-32l-51-109-56-22v-16q36-15 36-57 0-63-66-63z" fill="#303a35" stroke="#72887b" stroke-width="2" stroke-dasharray="7 6"/>
 <path d="M247 122q13 12 26 0" fill="none" stroke="#adc0ae" stroke-width="3" stroke-linecap="round"/>
 <path d="M209 354q51 16 102 0" fill="none" stroke="#52665b" stroke-width="2"/>
 <g transform="translate(108 421) rotate(-14)"><path d="M0-18l5 12 13 1-10 9 3 13-11-7-11 7 3-13-10-9 13-1z" fill="#b4c6b3"/><circle cx="-4" cy="1" r="1.5" fill="#27362d"/><circle cx="4" cy="1" r="1.5" fill="#27362d"/></g>
 </svg>`;}
function regionButtons(option){return regions.map((r,i)=>`<button type="button" class="region ${i%2?'side-right':'side-left'}" data-region="${r.id}" aria-pressed="false" aria-controls="sheet-${option.id}" aria-label="${r.name}. ${r.id==='heart'?'Live reading. ':''}${r.status}. Simulated. Show risk tabs."><span class="name">${option.id==='c'?`<span class="sticker-icon" aria-hidden="true">${r.symbol}</span>`:''}${r.name}</span><span class="status">${r.id==='heart'?'<b>ϟ LIVE</b>':r.id==='skin'?'▧ ':'○ '}${r.status}</span></button>`).join('');}
document.getElementById('options').innerHTML=options.map(o=>`<section id="option-${o.id}" class="option ${o.className}" role="tabpanel" aria-labelledby="tab-${o.id}" ${o.id==='a'?'':'hidden'}>
 <div class="heading"><div><div class="eyebrow">${o.eyebrow}</div><h1>${o.name}</h1></div><span class="simulated">Simulated</span></div>
 <p class="caption">${o.caption}</p>
 <div class="layout"><div class="map-shell"><div class="map-top"><span>${o.mapLabel}</span><span>06 regions</span></div><div class="stage" role="group" aria-label="${o.name} body regions. All statuses simulated.">${o.id==='a'?astronaut():o.id==='b'?scanner():stickers()}${regionButtons(o)}</div><p class="map-foot">${o.hint}</p></div>
 <aside class="sheet" id="sheet-${o.id}" aria-label="Selected region"><div class="eyebrow">Your check-in</div><div class="selection" aria-live="polite" aria-atomic="true"><h2>Where to start?</h2><div class="reading">Select any body region.</div></div><div class="risk-area" hidden><p class="risk-label">Risk tabs</p><div class="risk-tabs" role="tablist" aria-label="Region risks"></div><div class="risk-content" role="tabpanel" tabindex="0"></div></div><div class="sheet-tail"><span class="key">Tab</span> to explore · <span class="key">Enter</span> to select<br>Simulated samples · No health assessment</div></aside></div></section>`).join('');
function setRisk(panel,region,index,focus=false){
 const tabs=[...panel.querySelectorAll('.risk-tabs button')];
 tabs.forEach((b,i)=>{b.setAttribute('aria-selected',String(i===index));b.tabIndex=i===index?0:-1;});
 const name=region.tabs[index],content=panel.querySelector('.risk-content');
 content.setAttribute('aria-labelledby',tabs[index].id);
 content.innerHTML=`<h3>${name}</h3><p>${details[name]}</p>`;
 if(focus)tabs[index].focus();
}
function selectRegion(panel,id){
 const region=regions.find(r=>r.id===id),option=panel.id.slice(-1);
 panel.querySelectorAll('.region').forEach(b=>{const selected=b.dataset.region===id;b.setAttribute('aria-pressed',String(selected));b.classList.remove('pop');if(selected){void b.offsetWidth;b.classList.add('pop');}});
 panel.querySelectorAll('.hotspot').forEach(g=>{const selected=g.dataset.hotspot===id;g.classList.toggle('selected',selected);g.querySelector('.region-dot').classList.toggle('selected-dot',selected);});
 panel.querySelectorAll('.organ').forEach(g=>g.classList.toggle('revealed',g.dataset.organ===id));
 const body=panel.querySelector('.scan-body');if(body)body.classList.add('zoomed');
 panel.querySelector('.selection').innerHTML=`<div class="eyebrow">Region selected</div><h2>${region.name}</h2><div class="reading"><span class="signal">${id==='heart'?'ϟ Live · ':id==='skin'?'▧ ':'○ '}${region.status}</span><span class="simulated">Simulated</span></div>`;
 panel.querySelector('.risk-area').hidden=false;
 panel.querySelector('.risk-content').id=`risk-content-${option}`;
 panel.querySelector('.risk-tabs').innerHTML=region.tabs.map((name,i)=>`<button id="risk-${option}-${i}" role="tab" aria-controls="risk-content-${option}" aria-selected="${i===0}" tabindex="${i===0?0:-1}">${name}</button>`).join('');
 panel.querySelectorAll('.risk-tabs button').forEach((b,i)=>{b.addEventListener('click',()=>setRisk(panel,region,i));b.addEventListener('keydown',e=>{const next=tabIndex(e.key,i,region.tabs.length);if(next!==null){e.preventDefault();setRisk(panel,region,next,true);}});});
 setRisk(panel,region,0);
}
function tabIndex(key,index,length){if(key==='ArrowRight')return(index+1)%length;if(key==='ArrowLeft')return(index+length-1)%length;if(key==='Home')return 0;if(key==='End')return length-1;return null;}
const designTabs=[...document.querySelectorAll('.switcher button')];
function switchOption(index,focus=false){designTabs.forEach((tab,i)=>{tab.setAttribute('aria-selected',String(i===index));tab.tabIndex=i===index?0:-1;document.getElementById('option-'+tab.dataset.option).hidden=i!==index;});if(focus)designTabs[index].focus();}
designTabs.forEach((tab,i)=>{tab.addEventListener('click',()=>switchOption(i));tab.addEventListener('keydown',e=>{const next=tabIndex(e.key,i,designTabs.length);if(next!==null){e.preventDefault();switchOption(next,true);}});});
document.querySelectorAll('.option').forEach(panel=>panel.querySelectorAll('.region').forEach(button=>{
 button.addEventListener('click',()=>selectRegion(panel,button.dataset.region));
 const glow=on=>{const dot=panel.querySelector(`[data-hotspot="${button.dataset.region}"]`);if(dot)dot.classList.toggle('lit',on);};
 button.addEventListener('mouseenter',()=>glow(true));button.addEventListener('mouseleave',()=>glow(false));button.addEventListener('focus',()=>glow(true));button.addEventListener('blur',()=>glow(false));
}));
</script>
</body>
</html>
