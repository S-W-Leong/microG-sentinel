<head>

<style>
:root{color-scheme:dark;--bg:#111315;--ink:#f2efe7;--muted:#a0aaad;--line:#394044;--orange:#ff5a1f;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit}button{color:inherit;cursor:pointer;touch-action:manipulation;min-height:44px}button:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:5px}button:hover{filter:brightness(1.15)}[hidden]{display:none!important}.mono{font-family:ui-monospace,Consolas,monospace}.app{max-width:1180px;padding:28px 36px 20px;margin:auto}.mast{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:24px;border-bottom:1px solid var(--line);font-size:13px}.brand{display:flex;align-items:center;gap:10px;font-weight:650}.mark{width:23px;height:23px}.simulated{border:1px solid #536064;border-radius:6px;font-size:11px;padding:5px 9px;white-space:nowrap;color:#c7d4d3}.simulated:before{content:'◇';margin-right:6px}.intro{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:28px 0 10px}.kicker{color:var(--muted);font-size:12px;margin:0 0 8px}h1{font-weight:500;font-size:clamp(32px,4vw,45px);letter-spacing:-.045em;margin:0 0 9px}p{line-height:1.5}.subtitle{font-size:14px;color:var(--muted);margin:0}.label-control{display:flex;align-items:center;gap:5px;flex-shrink:0;font-size:12px}.label-control>span{margin-right:5px;color:var(--muted)}.mode{border:1px solid transparent;background:transparent;padding:7px 12px;border-radius:8px;color:var(--muted)}.mode[aria-pressed=true]{background:#e1e4dc;color:#171b1e}.board{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 410px minmax(0,1fr);grid-template-rows:repeat(3,minmax(180px,auto));gap:12px 26px;align-items:center;margin-top:25px;padding:12px 0 8px;min-height:616px}.figure{grid-column:2;grid-row:1/4;position:relative;align-self:center;min-width:0}.stage{position:relative;aspect-ratio:480/640}.figure-art{width:100%;height:100%;display:block}.figure-transform{position:absolute;inset:0;transform-origin:50% 45%;transition:transform .45s ease}.figure-transform.selected{transform:scale(1.035)}.scan-frame{fill:none;stroke:#607478;stroke-width:1}.suit{stroke:#444f54;stroke-width:3;stroke-linejoin:round}.seam{fill:none;stroke:#8d9d9e;stroke-width:2}.organ{fill:#203b40;stroke:#d1eeee;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}.lens{opacity:0}.lens.visible{opacity:1}.lens-sweep{animation:lens-sweep .65s ease-out both}.load-scan{animation:scan 2.1s ease-in-out both;pointer-events:none}.lens-ring{fill:none;stroke:var(--orange);stroke-width:2}.hotspot{position:absolute;width:44px;height:44px;padding:0;translate:-50% -50%;border:0;border-radius:50%;background:transparent;z-index:3;display:grid;place-items:center}.hotspot:before{content:'';width:10px;height:10px;border-radius:50%;border:2px solid #111315;background:#d0e7e6;box-shadow:0 0 0 1px #b9d8da}.hotspot:hover:before{box-shadow:0 0 0 7px #b9d8da30}.hotspot[aria-pressed=true]:before{background:var(--orange);box-shadow:0 0 0 5px #ff5a1f25;border-color:#111315}.hotspot[aria-pressed=true]{transform:translateX(48px)}.figure-caption{text-align:center;color:var(--muted);font-size:12px;margin:8px 0 12px}.other{display:block;margin:auto;background:transparent;border:1px solid #566166;border-radius:24px;padding:8px 17px;font-size:12px}.other span{font-size:16px;margin-right:6px}.leaders{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}.leaders path{fill:none;stroke:#5c7075;stroke-width:1;stroke-dasharray:3 5}.leaders path.active{stroke:var(--orange)}.card{position:relative;z-index:1;min-width:0;border:1px solid var(--line);background:#181d20;border-radius:13px;align-self:center;transition:border-color .2s}.card[data-region=head]{grid-column:1;grid-row:1}.card[data-region=eyes]{grid-column:3;grid-row:1}.card[data-region=heart]{grid-column:1;grid-row:2}.card[data-region=skin]{grid-column:3;grid-row:2}.card[data-region=gut]{grid-column:1;grid-row:3}.card[data-region=bones]{grid-column:3;grid-row:3}.chip{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:64px;background:transparent;border:0;border-radius:12px;text-align:left;padding:15px;font-size:13px}.chip-label{display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px}.chip-status{font-size:12px;color:var(--muted)}.chip-status:before{content:'·';margin-right:7px;font-family:system-ui,sans-serif}.chip-icon{font-size:15px;color:#d5e7e5}.card.no-data .chip{color:#acb5b7}.card.new-data{border-color:#789093}.card.new-data .chip-status{color:#e6eee9}.chip .arrow{color:var(--muted)}.card.expanded{border-color:var(--orange);background:#1c1d1c}.card.expanded .chip{min-height:52px;color:var(--orange);padding-bottom:6px;font-size:15px}.card.expanded .chip-status{display:none}.card.expanded .arrow{color:var(--orange)}.details{padding:0 15px 15px}.status-line{font-size:12px;color:#d1dad7;margin:3px 0 12px}.flag{display:inline-flex;gap:5px;align-items:center;color:#dbe7e4;font-size:11px}.collapsed-flag{padding:0 15px 12px;margin-top:-9px}.flag svg{width:13px;height:13px;flex-shrink:0}.risk-buttons{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}.risk{font-size:11px;min-height:36px;border:1px solid #465154;background:transparent;border-radius:6px;padding:6px 10px}.risk[aria-pressed=true]{border-color:#d7e3dd;background:#d7e3dd;color:#111315}.primary{display:flex;align-items:center;justify-content:space-between;background:var(--orange);color:#111315;font-size:13px;font-weight:700;border:0;border-radius:7px;width:100%;padding:10px 13px}.legend{display:flex;gap:18px;justify-content:center;color:var(--muted);font-size:11px;margin:25px 0 22px}.legend span{display:flex;gap:6px;align-items:center}.legend b{font-size:14px;color:#d5e7e5;font-weight:400}.footer{display:flex;gap:16px;justify-content:space-between;border-top:1px solid var(--line);padding-top:17px;color:var(--muted);font-size:11px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}dialog{width:calc(100% - 36px);max-width:420px;max-height:85dvh;overflow:auto;background:#191e21;color:var(--ink);border:1px solid #637074;border-radius:16px;padding:24px}dialog::backdrop{background:#080b0dc9}dialog h2{font-size:23px;font-weight:500;letter-spacing:-.02em;margin:18px 0 10px}dialog p,dialog label{font-size:13px;color:#c2cecc}dialog textarea{width:100%;min-height:108px;background:#111315;border:1px solid #536064;border-radius:8px;color:var(--ink);padding:12px;margin:10px 0;resize:vertical}.dialog-close{background:transparent;border:1px solid #536064;border-radius:8px;padding:8px 14px;width:100%;margin-top:14px}.dialog-note{font-size:11px;color:var(--muted)}
@keyframes scan{0%{transform:translateY(55px);opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translateY(585px);opacity:0}}@keyframes lens-sweep{from{transform:translateY(-80px)}to{transform:translateY(80px)}}

</style>

<script>
'use strict';
const regions = [
{id:'head',name:'Head',short:'Head',status:'No data',tabs:['Sleep','Balance','Mood'],point:[240,100],radius:49},
{id:'eyes',name:'Eyes',short:'Eyes',status:'No data',tabs:['SANS'],point:[240,145],radius:47},
{id:'heart',name:'Heart & lungs',short:'Heart',status:'+41 bpm',tabs:['Heart'],point:[240,297],radius:51,newData:true},
{id:'skin',name:'Skin',short:'Skin',status:'1 new',tabs:['Immune'],point:[354,337],radius:43,newData:true,flag:true},
{id:'gut',name:'Gut',short:'Gut',status:'No data',tabs:['Food','Microbiome'],point:[240,369],radius:48},
{id:'bones',name:'Bones',short:'Bones',status:'No data',tabs:['Bone'],point:[268,478],radius:54}
];
const riskCopy = {Sleep:'No sleep sample yet.',Balance:'No balance sample yet.',Mood:'No mood check-in yet.',SANS:'No vision sample yet.',Heart:'Simulated change from baseline: +41 bpm. This is not a health assessment.',Immune:'One simulated skin photo is marked for review at a private medical conference (PMC). No conference has been scheduled.',Food:'No food log yet.',Microbiome:'No microbiome sample yet.',Bone:'No bone sample yet.'};
const flag = '<span class="flag"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 14V2m0 0h10l-3 3 3 3H3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>Raise at PMC</span>';
const board = document.getElementById('board');
const transform = document.getElementById('figure-transform');
const dialog = document.getElementById('dialog');
const announcement = document.getElementById('announcement');
let selected = null;
let mode = 'always';
let activeRisk = null;
let lastTrigger = null;
regions.forEach(region => {
const hotspot = document.createElement('button');
hotspot.className = 'hotspot';hotspot.dataset.region = region.id;
hotspot.style.left = region.point[0]/480*100+'%';hotspot.style.top = region.point[1]/640*100+'%';
hotspot.setAttribute('aria-label',region.name+': '+region.status+(region.flag?', Raise at PMC':'')+'. Scan region');
hotspot.setAttribute('aria-pressed','false');hotspot.setAttribute('aria-controls','details-'+region.id);
hotspot.addEventListener('click',()=>selectRegion(selected===region.id?null:region.id));
document.getElementById('hotspots').append(hotspot);
const card = document.createElement('article');card.className = 'card '+(region.newData?'new-data':'no-data');card.dataset.region = region.id;
card.innerHTML = '<button class="chip" aria-expanded="false" aria-controls="details-'+region.id+'" aria-label="'+region.name+': '+region.status+(region.flag?', Raise at PMC':'')+'"><span class="chip-label"><span class="chip-icon" aria-hidden="true">'+(region.newData?'↗':'○')+'</span><span class="region-name">'+region.short+'</span><span class="chip-status '+(region.id==='heart'?'mono':'')+'">'+region.status+'</span></span><span class="arrow" aria-hidden="true">+</span></button>'+(region.flag?'<div class="collapsed-flag">'+flag+'</div>':'')+'<div class="details" id="details-'+region.id+'" hidden><p class="status-line">'+(region.id==='heart'?'<span class="mono">+41 bpm</span> · From baseline':region.id==='skin'?'1 new photo':region.status)+'</p>'+(region.flag?flag:'')+'<div class="risk-buttons" role="group" aria-label="Linked risk tabs">'+region.tabs.map((tab,index)=>'<button class="risk" aria-pressed="'+(index===0)+'" data-risk="'+tab+'">'+tab+'</button>').join('')+'</div><button class="primary open-risk" aria-label="Open '+region.tabs[0]+'">Open <span aria-hidden="true">↗</span></button></div>';
board.append(card);
card.querySelector('.chip').addEventListener('click',()=>selectRegion(selected===region.id?null:region.id));
card.querySelectorAll('.risk').forEach(button=>button.addEventListener('click',()=>{
activeRisk = button.dataset.risk;
card.querySelectorAll('.risk').forEach(risk=>risk.setAttribute('aria-pressed',String(risk===button)));
card.querySelector('.open-risk').setAttribute('aria-label','Open '+activeRisk);
announcement.textContent = activeRisk+' selected. Open to view the simulated sample.';
}));
card.querySelector('.open-risk').addEventListener('click',event=>openDialog(activeRisk,'<p>'+riskCopy[activeRisk]+'</p><p class="dialog-note">Prototype view only. Nothing is sent or saved.</p>',event.currentTarget));
});
function selectRegion(id){
selected = id;const region = regions.find(item=>item.id===id);activeRisk = region?region.tabs[0]:null;
document.querySelectorAll('.hotspot').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.region===id)));
document.querySelectorAll('.card').forEach(card=>{
const expanded = card.dataset.region===id;const item = regions.find(entry=>entry.id===card.dataset.region);
card.classList.toggle('expanded',expanded);card.querySelector('.chip').setAttribute('aria-expanded',String(expanded));
card.querySelector('.region-name').textContent = expanded?item.name:item.short;card.querySelector('.arrow').textContent = expanded?'−':'+';
card.querySelector('.details').hidden = !expanded;const collapsedFlag = card.querySelector('.collapsed-flag');if(collapsedFlag)collapsedFlag.hidden = expanded;
card.querySelectorAll('.risk').forEach((button,index)=>button.setAttribute('aria-pressed',String(index===0)));
card.querySelector('.open-risk').setAttribute('aria-label','Open '+item.tabs[0]);
});
transform.classList.toggle('selected',Boolean(region));document.getElementById('lens').classList.toggle('visible',Boolean(region));
document.querySelectorAll('[data-organ]').forEach(organ=>organ.style.display = organ.dataset.organ===id?'':'none');
if(region){
['lens-clip-circle','lens-ring'].forEach(elementId=>{const circle = document.getElementById(elementId);circle.setAttribute('cx',region.point[0]);circle.setAttribute('cy',region.point[1]);circle.setAttribute('r',region.radius);});
document.getElementById('lens-pass').setAttribute('transform','translate(0 '+region.point[1]+')');
const sweep = document.querySelector('.lens-sweep');sweep.style.animation = 'none';void sweep.getBoundingClientRect();sweep.style.animation = '';
}
document.getElementById('figure-caption').textContent = region?region.name+' · Suit scan revealed':'Six regions. Your starting point.';
announcement.textContent = region?region.name+' selected. '+region.status+'.'+(region.flag?' Raise at PMC.':'')+' Simulated.':'Region closed.';
requestAnimationFrame(drawLeaders);
}
function drawLeaders(){
const svg = document.querySelector('.leaders');const rect = board.getBoundingClientRect();const stage = transform.getBoundingClientRect();
svg.setAttribute('viewBox','0 0 '+rect.width+' '+rect.height);
svg.innerHTML = regions.filter(region=>mode==='always'||region.id===selected).map(region=>{
const card = board.querySelector('.card[data-region="'+region.id+'"]').getBoundingClientRect();const left = ['head','heart','gut'].includes(region.id);
const startX = (left?card.right:card.left)-rect.left;const startY = card.top-rect.top+28;
const endX = stage.left-rect.left+stage.width*region.point[0]/480;const endY = stage.top-rect.top+stage.height*region.point[1]/640;
const elbow = startX+(left?18:-18);
return '<path class="'+(region.id===selected?'active':'')+'" d="M'+startX+' '+startY+'H'+elbow+'L'+endX+' '+endY+'"/>';
}).join('');
}
document.querySelectorAll('.mode').forEach(button=>button.addEventListener('click',()=>{
mode = button.dataset.mode;board.classList.toggle('tap-mode',mode==='tap');
document.querySelectorAll('.mode').forEach(option=>option.setAttribute('aria-pressed',String(option===button)));
announcement.textContent = mode==='tap'?'Labels on tap. Select a body region.':'All region labels visible.';requestAnimationFrame(drawLeaders);
}));
function openDialog(title,content,trigger){lastTrigger = trigger;document.getElementById('dialog-title').textContent = title;document.getElementById('dialog-content').innerHTML = content;dialog.showModal();}
document.getElementById('other').addEventListener('click',event=>openDialog('Something else','<label for="note">What would you like to note?</label><textarea id="note" maxlength="500" placeholder="Describe it in your own words."></textarea><p class="dialog-note">Practice only. This note is discarded when closed. It is not sent to a medical team.</p>',event.currentTarget));
document.getElementById('dialog-close').addEventListener('click',()=>dialog.close());
dialog.addEventListener('close',()=>{document.getElementById('dialog-content').replaceChildren();if(lastTrigger)lastTrigger.focus();});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!dialog.open&&selected){const previous = selected;selectRegion(null);document.querySelector('.hotspot[data-region="'+previous+'"]').focus();}});
new ResizeObserver(drawLeaders).observe(board);transform.addEventListener('transitionend',drawLeaders);selectRegion(null);
</script>
</body>
</html>
